# Configuration for Guitar Transcription Training

# Experiment settings
experiment:
  name: "baseline_audio_only"
  seed: 42
  device: "cpu"  # "cuda" or "cpu"

# Data settings
data:
  root_dir: "data/guitarset"
  split_dir: "splits"
  csv_dir: "csv_annotations"
  audio_dir: "audio_mono-mic"
  
  # Audio parameters
  sr: 22050
  hop_length: 512
  n_bins: 72
  bins_per_octave: 12
  fmin: 65.4  # C2
  
  # Dataset parameters
  context_window_ms: 150
  prediction_frames: 1
  total_frames: 13  # 2 * context_frames + prediction_frames
  
  # Normalization
  midi_min: 36  # C2 (was incorrectly 40=E2)
  midi_max: 108  # C8
  
  # Negative sampling (increased for better training)
  negative_ratio: 3.0  # 3x more negative samples (75% silence, 25% onsets)
  
  # Augmentation (DISABLED for now)
  augmentation:
    pitch_shift_range: [-2.0, 2.0]  # semitones
    time_stretch_range: [0.9, 1.1]
    noise_std: 0.005
    apply_augmentation: false  # DISABLED

# Model settings
model:
  type: "BaselineCNN"  # "BaselineCNN" or "DualBranch"
  n_strings: 6
  
  # Baseline CNN architecture (optimized for ~250K params)
  baseline:
    encoder_channels: [32, 64, 96]  # Reduced from [32, 64, 128]
    head_hidden: 48  # Reduced from 64
    dropout: 0.3

# Training settings
training:
  batch_size: 512  # Same as dual_branch for fair comparison
  epochs: 6  # Same as dual_branch (OneCycleLR)
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  
  # DataLoader settings
  num_workers: 0  # Number of worker processes (0 = main process)
  prefetch_factor: 2  # Number of batches loaded in advance by each worker
  
  # Loss weights (BALANCED)
  loss:
    onset_weight: 2.0  # Balanced with pitch
    pitch_weight: 2.0  # Balanced with onset

  # Learning rate scheduler (One Cycle for 6 epochs)
  scheduler:
    type: "one_cycle"
    max_lr: 0.001
    epochs: 6
    steps_per_epoch: null  # Will be computed from dataloader
    pct_start: 0.3  # 30% warmup, 70% decay
    anneal_strategy: "cos"  # Cosine annealing
  
  # Early stopping
  early_stopping:
    patience: 15
    min_delta: 0.0001
    mode: "min"
  
  # Validation
  validation:
    interval: 1  # Validate every N epochs
    save_best: true
  
  # Checkpointing
  checkpoint:
    save_dir: "experiments/baseline/checkpoints"
    save_last: true
    save_best: true
  
  # Logging
  logging:
    log_dir: "experiments/baseline/logs"
    print_freq: 1  # Print every N batches
    use_tqdm: true

# Evaluation settings
evaluation:
  onset_threshold: 0.5
  onset_tolerance_ms: 50
  midi_min: 36  # C2
  midi_max: 108  # C8

  # Metrics
  metrics:
    - "onset_precision"
    - "onset_recall"
    - "onset_f1"
    - "pitch_mae"
    - "pitch_rmse"
    - "combined_score"
