# Configuration for Guitar Transcription Training

# Experiment settings
experiment:
  name: "baseline_audio_only"
  seed: 42
  device: "cpu"  # "cuda" or "cpu"

# Data settings
data:
  root_dir: "data/guitarset"
  split_dir: "splits"
  csv_dir: "csv_annotations"
  audio_dir: "audio_mono-mic"
  
  # Audio parameters
  sr: 22050
  hop_length: 512
  n_bins: 72
  bins_per_octave: 12
  fmin: 65.4  # C2
  
  # Dataset parameters
  context_window_ms: 150
  prediction_frames: 1
  total_frames: 13  # 2 * context_frames + prediction_frames
  
  # Normalization
  midi_min: 40  # E2
  midi_max: 103  # C6
  
  # Augmentation
  augmentation:
    pitch_shift_range: [-2.0, 2.0]  # semitones
    time_stretch_range: [0.9, 1.1]
    noise_std: 0.005
    apply_augmentation: true

# Model settings
model:
  type: "BaselineCNN"  # "BaselineCNN" or "DualBranch"
  n_strings: 6
  
  # Baseline CNN architecture (optimized for ~250K params)
  baseline:
    encoder_channels: [32, 64, 96]  # Reduced from [32, 64, 128]
    head_hidden: 48  # Reduced from 64
    dropout: 0.3

# Training settings
training:
  batch_size: 64
  epochs: 10
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  
  # DataLoader settings
  num_workers: 0  # Number of worker processes (0 = main process)
  prefetch_factor: 2  # Number of batches loaded in advance by each worker
  
  # Loss weights
  loss:
    onset_weight: 1.0
    pitch_weight: 1.0
  
  # Learning rate scheduler
  scheduler:
    type: "reduce_on_plateau"
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 0.000001  # Use explicit float notation
  
  # Early stopping
  early_stopping:
    patience: 15
    min_delta: 0.0001
    mode: "min"
  
  # Validation
  validation:
    interval: 1  # Validate every N epochs
    save_best: true
  
  # Checkpointing
  checkpoint:
    save_dir: "experiments/baseline/checkpoints"
    save_last: true
    save_best: true
  
  # Logging
  logging:
    log_dir: "experiments/baseline/logs"
    print_freq: 1  # Print every N batches
    use_tqdm: true

# Evaluation settings
evaluation:
  onset_threshold: 0.5
  onset_tolerance_ms: 50
  midi_min: 40
  midi_max: 103
  
  # Metrics
  metrics:
    - "onset_precision"
    - "onset_recall"
    - "onset_f1"
    - "pitch_mae"
    - "pitch_rmse"
    - "combined_score"
